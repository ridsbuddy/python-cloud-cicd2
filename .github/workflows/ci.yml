name: CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/ridsbuddy/python-cloud-cicd:latest .   

      - name: Push Docker image
        run: |
          docker push ghcr.io/ridsbuddy/python-cloud-cicd:latest    

      - name: Deploy to EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-003784fe97743e842" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "sudo -u ubuntu -H docker pull ghcr.io/ridsbuddy/python-cloud-cicd:latest",
              "sudo -u ubuntu -H docker stop python-cloud-web || true",
              "sudo -u ubuntu -H docker rm python-cloud-web || true",
              "sudo -u ubuntu -H docker run -d --name python-cloud-web -p 5000:5000 ghcr.io/ridsbuddy/python-cloud-cicd:latest"
            ]' \
            --query "Command.CommandId" \
            --output text \
            --region eu-north-1)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-003784fe97743e842" \
            --region eu-north-1

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-003784fe97743e842" \
            --query "Status" \
            --output text \
            --region eu-north-1)

          echo "Deployment status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            exit 1
          fi
