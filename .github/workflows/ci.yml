name: CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/ridsbuddy/python-cloud-cicd:latest .   

      - name: Push Docker image
        run: |
          docker push ghcr.io/ridsbuddy/python-cloud-cicd:latest    

      - name: Deploy to EC2
        run: |
          aws ssm send-command \
            --instance-ids "i-003784fe97743e842" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "docker pull ghcr.io/ridsbuddy/python-cloud-cicd:latest",
              "docker stop python-cloud-web || true",
              "docker rm python-cloud-web || true",
              "docker run -d --name python-cloud-web -p 5000:5000 ghcr.io/ridsbuddy/python-cloud-cicd:latest"
            ]' \
            --region eu-north-1
            
