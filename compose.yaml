services: 

  web:
    build: . 
    container_name: python-cloud-web
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_NAME: devopsdb
      DB_user: devopsuser
      DB_PORT: 5432
      DB_PASSWORD: devopspass
    depends_on:
      - db
    restart: unless-stopped



  db:
    image: postgres:16-alpine
    container_name: python-cloud-db
    environment:
      POSTGRES_DB: devopsdb
      POSTGRES_USER: devopsuser
      POSTGRES_PASSWORD: devopspass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports: 
      - "5432:5432"
    restart: unless-stopped


volumes:
   postgres_data:
